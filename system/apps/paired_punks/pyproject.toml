[project]
name = "paired-punks"
version = "0.1.0"
description = "Private shared project spaces for hackathon partners: share chats, prompts, results and files, kept in sync through GitHub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
]

[project.scripts]
paired-punks = "paired_punks.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paired_punks"]
